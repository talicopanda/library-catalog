<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Catalog</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1 id="site-title">Library catalog</h1>
        <p id="stats"></p>
      </div>
      <div class="language-switch" role="group" aria-label="Language / Idioma">
        <button type="button" data-language="en" aria-pressed="true">EN</button>
        <button type="button" data-language="pt-BR" aria-pressed="false">PT-BR</button>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="search" data-i18n="searchTab">Search</button>
      <button class="tab" data-tab="browse" data-i18n="browseTab">Browse by shelf</button>
    </div>

    <!-- Search Tab -->
    <section id="search" class="tab-content active">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Search by title, author, publisher, ISBN, or shelf…"
          data-i18n-placeholder="searchPlaceholder"
          autofocus
        />
      </div>
      <p id="search-status" class="status"></p>
      <div id="search-results" class="book-grid"></div>
    </section>

    <!-- Browse Tab -->
    <section id="browse" class="tab-content">
      <div class="location-bar">
        <label for="location-select" data-i18n="shelfLabel">Shelf:</label>
        <select id="location-select"></select>
        <span id="browse-count" class="status"></span>
      </div>
      <div id="browse-results" class="book-grid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
